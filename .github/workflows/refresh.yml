name: Refresh scanners
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python generate.py
      - run: |
          git config user.name "scanners-bot"
          git config user.email "scanners-bot@localhost"
          git add index.html
          git diff --cached --quiet || git commit -m "refresh $(date -u +%Y-%m-%dT%H:%M)"
          git push
