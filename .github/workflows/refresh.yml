name: Refresh scanners
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python generate.py
      - run: |
          git config user.name "scanners-bot"
          git config user.email "scanners-bot@localhost"
          git add index.html version.json recovery_history.json sp500_tickers_cache.json
          [ -f market_scanner_universe.json ] && git add market_scanner_universe.json || true
          [ -f market_scanner_universe.csv ] && git add market_scanner_universe.csv || true
          [ -f cnn_snapshot.json ] && git add cnn_snapshot.json || true
          [ -f clinical_trials_cache.json ] && git add clinical_trials_cache.json || true
          [ -f biotech_breakthroughs_cache.json ] && git add biotech_breakthroughs_cache.json || true
          [ -f biotech_universe.json ] && git add biotech_universe.json || true
          [ -f sp500_names_cache.json ] && git add sp500_names_cache.json || true
          git diff --cached --quiet || git commit -m "refresh $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash
          git push
