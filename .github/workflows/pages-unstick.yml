name: Unstick Pages deployment (one-shot maintenance)
on:
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel wedged Pages deployment by sha (deploy-pages internal route)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/deployment/cancel/eab80366aa1090baa85055b39f090756594cfaba"
