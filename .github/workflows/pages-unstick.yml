name: Unstick Pages deployment (one-shot maintenance)
on:
  workflow_dispatch:
permissions:
  deployments: write
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete stuck Pages deployment record 7470373852 (eab8036)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X DELETE "repos/${{ github.repository }}/deployments/7470373852"
