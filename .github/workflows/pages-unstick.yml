name: Unstick Pages deployment (one-shot maintenance)
on:
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel stuck Pages deployment 7470373852
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/deployments/7470373852/cancel"
