name: Unstick Pages deployment (one-shot maintenance)
on:
  workflow_dispatch:
permissions:
  deployments: write
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mark wedged deployment 7470373852 inactive then delete it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/deployments/7470373852/statuses" -f state=inactive -f environment=github-pages -f description="Unsticking wedged Pages queue"
          gh api -X DELETE "repos/${{ github.repository }}/deployments/7470373852"
