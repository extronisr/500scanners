name: Unstick Pages deployment (one-shot maintenance)
on:
  workflow_dispatch:
permissions:
  pages: write
  id-token: write
jobs:
  cancel-stuck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List and cancel stuck in-progress Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages/deployments" --jq '.[] | "\(.id)"' > /tmp/ids.txt || true
          cat /tmp/ids.txt
          for id in $(cat /tmp/ids.txt); do
            echo "cancelling $id"
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$id/cancel" || true
          done
